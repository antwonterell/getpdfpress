<!-- IMPROVED PDF TO JPG RESULTS SECTION -->
<div id="pdfToJpgResults" class="hidden mt-8 slide-up">
  <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg border border-slate-200 dark:border-slate-700 p-6">
    
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h3 class="text-xl font-bold text-slate-900 dark:text-white">
          ✅ Conversion Complete
        </h3>
        <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">
          <span id="jpgPageCount">0</span> page(s) converted to images
        </p>
      </div>
      
      <!-- Download All as ZIP Button -->
      <button
        id="downloadAllZip"
        class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all duration-200 flex items-center gap-2"
      >
        <span>📦</span>
        <span>Download All as ZIP</span>
      </button>
    </div>

    <!-- Images Grid -->
    <div id="jpgImagesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Images will be inserted here dynamically -->
    </div>

    <!-- Try Another Button -->
    <button
      id="jpgAnotherBtn"
      class="mt-6 w-full py-3 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-900 dark:text-white font-semibold rounded-xl transition-all duration-200"
    >
      Convert Another PDF
    </button>
  </div>
</div>

<script>
// IMPROVED PDF TO JPG HANDLER
async function handlePdfToJpg() {
  if (!selectedFile) return;

  const resultsEl = document.getElementById('pdfToJpgResults');
  const pageCountEl = document.getElementById('jpgPageCount');
  const imagesGridEl = document.getElementById('jpgImagesGrid');
  const downloadAllBtn = document.getElementById('downloadAllZip');
  const anotherBtn = document.getElementById('jpgAnotherBtn');
  
  try {
    // Show loading state
    statusEl.textContent = '🔄 Converting PDF to images...';
    
    const formData = new FormData();
    formData.append('file', selectedFile);

    const response = await fetch('YOUR_API_URL/api/pdf-to-images', {
      method: 'POST',
      body: formData,
    });

    if (!response.ok) {
      const errorData = await response.json();
      throw new Error(errorData.error || 'Conversion failed');
    }

    const data = await response.json();
    
    // Update UI
    pageCountEl.textContent = data.pageCount;
    imagesGridEl.innerHTML = '';

    // Create image cards
    data.images.forEach((image, index) => {
      const card = createImageCard(image, index, selectedFile);
      imagesGridEl.appendChild(card);
    });

    // Show results
    resultsEl.classList.remove('hidden');
    statusEl.textContent = `✅ Converted ${data.pageCount} page(s) successfully!`;

    // Handle ZIP download
    downloadAllBtn.onclick = () => downloadAllAsZip(selectedFile);
    
    // Handle try another
    anotherBtn.onclick = resetFlow;

  } catch (error) {
    console.error('PDF to JPG error:', error);
    statusEl.textContent = `❌ Error: ${error.message}`;
    alert(`Conversion failed: ${error.message}`);
  }
}

// Create individual image card with preview and download button
function createImageCard(image, index, originalFile) {
  const card = document.createElement('div');
  card.className = 'bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden hover:shadow-lg transition-all duration-200';
  
  card.innerHTML = `
    <div class="relative group">
      <!-- Image Preview -->
      <img 
        src="${image.data}" 
        alt="Page ${image.pageNumber}"
        class="w-full h-auto object-contain bg-white dark:bg-slate-800"
        style="max-height: 300px;"
      />
      
      <!-- Overlay on hover -->
      <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-40 transition-all duration-200 flex items-center justify-center">
        <button
          onclick="downloadSingleImage('${image.data}', '${image.filename}')"
          class="opacity-0 group-hover:opacity-100 transform scale-90 group-hover:scale-100 transition-all duration-200 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-lg flex items-center gap-2"
        >
          <span>⬇️</span>
          <span>Download</span>
        </button>
      </div>
    </div>
    
    <!-- Card Footer -->
    <div class="p-3 border-t border-slate-200 dark:border-slate-700">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm font-semibold text-slate-900 dark:text-white">
            Page ${image.pageNumber}
          </p>
          <p class="text-xs text-slate-500 dark:text-slate-400">
            ${formatFileSize(image.size)}
          </p>
        </div>
        
        <button
          onclick="downloadSingleImage('${image.data}', '${image.filename}')"
          class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg transition-all duration-200"
        >
          Download
        </button>
      </div>
    </div>
  `;
  
  return card;
}

// Download single image
function downloadSingleImage(dataUrl, filename) {
  const link = document.createElement('a');
  link.href = dataUrl;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// Download all images as ZIP
async function downloadAllAsZip(file) {
  try {
    statusEl.textContent = '📦 Creating ZIP file...';
    
    const formData = new FormData();
    formData.append('file', file);

    const response = await fetch('YOUR_API_URL/api/pdf-to-images-zip', {
      method: 'POST',
      body: formData,
    });

    if (!response.ok) {
      throw new Error('Failed to create ZIP');
    }

    const blob = await response.blob();
    const url = window.URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'pdf-pages.zip';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    window.URL.revokeObjectURL(url);

    statusEl.textContent = '✅ ZIP downloaded successfully!';
  } catch (error) {
    console.error('ZIP download error:', error);
    statusEl.textContent = `❌ ZIP download failed: ${error.message}`;
    alert(`ZIP download failed: ${error.message}`);
  }
}

// Format file size helper
function formatFileSize(bytes) {
  if (bytes === 0) return '0 Bytes';
  const k = 1024;
  const sizes = ['Bytes', 'KB', 'MB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
}

// Reset flow helper
function resetFlow() {
  selectedFile = null;
  if (fileInputEl) fileInputEl.value = '';
  if (resultsEl) resultsEl.classList.add('hidden');
  if (document.getElementById('pdfToJpgResults')) {
    document.getElementById('pdfToJpgResults').classList.add('hidden');
  }
  if (statusEl) statusEl.textContent = 'Choose a file to begin';
}
</script>

<style>
/* Image card hover effects */
.group:hover img {
  transform: scale(1.02);
  transition: transform 0.3s ease;
}

/* Smooth transitions */
#jpgImagesGrid > div {
  animation: slideUp 0.4s ease-out;
  animation-fill-mode: both;
}

#jpgImagesGrid > div:nth-child(1) { animation-delay: 0.05s; }
#jpgImagesGrid > div:nth-child(2) { animation-delay: 0.1s; }
#jpgImagesGrid > div:nth-child(3) { animation-delay: 0.15s; }
#jpgImagesGrid > div:nth-child(4) { animation-delay: 0.2s; }
#jpgImagesGrid > div:nth-child(5) { animation-delay: 0.25s; }
#jpgImagesGrid > div:nth-child(6) { animation-delay: 0.3s; }

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
