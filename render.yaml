services:
  - type: web
    name: getpdfpress
    runtime: docker
    plan: 1c-2g # Preserve the existing Standard 1 CPU / 2 GB instance
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CONVERTAPI_SECRET
        sync: false  # Set this manually in Render dashboard
